<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Pebble Health mark</title>
  <desc id="desc">A rounded pebble containing a pulse line.</desc>
  <defs>
    <linearGradient id="pebble" x1="18" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55e6d2"/>
      <stop offset=".56" stop-color="#26c6a7"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <linearGradient id="pulse" x1="25" y1="64" x2="104" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecfffb"/>
      <stop offset="1" stop-color="#c9c2ff"/>
    </linearGradient>
  </defs>

  <!-- An asymmetric pebble gives the mark a softer, less medical shape. -->
  <path fill="url(#pebble)" d="M67 10c21 1 39 14 47 33 8 20 5 45-9 60-13 14-35 18-56 12-20-6-37-22-42-42-5-19 2-40 18-52C37 14 52 9 67 10Z"/>

  <!-- The dark stroke is the carved negative space; the fine highlight keeps it legible at favicon size. -->
  <path fill="none" stroke="#101827" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M24 65h22l8-18 12 37 10-24 7 12h21"/>
  <path fill="none" stroke="url(#pulse)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M24 65h22l8-18 12 37 10-24 7 12h21"/>
  <circle cx="24" cy="65" r="4.5" fill="#8b7cf6"/>
</svg>
