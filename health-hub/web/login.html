<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f1ec"><title>Sign in · Pebble Health</title>
  <link rel="icon" type="image/svg+xml" href="icons/brand.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login-page" tabindex="-1"><div class="login-card"><div class="brand"><img class="brand-mark" src="icons/brand.svg" width="40" height="40" alt="" aria-hidden="true"><p class="brand-name">Pebble Health</p></div><h1>Sign in</h1>
<p class="lede">Sign in to view your health data.</p>
<form id="login-form"><label class="field" for="username">Username<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-z0-9][a-z0-9._-]{2,39}" minlength="3" maxlength="40" required autofocus></label><label class="field" for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><p id="error" class="sheet-error" role="alert" hidden></p><button class="btn primary" type="submit">Sign in</button></form>
</div></main>
<script>
'use strict';
const form=document.getElementById('login-form'),username=document.getElementById('username'),password=document.getElementById('password'),error=document.getElementById('error');
form.addEventListener('submit',async event=>{event.preventDefault();error.hidden=true;const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','X-PH-Request':'1'},body:JSON.stringify({username:username.value.trim().toLowerCase(),password:password.value})});let data=null;try{data=await response.json();}catch(e){}if(response.ok){password.value='';try{localStorage.setItem('ph-auth-logout',String(Date.now()));}catch(e){}window.location.replace('/');return;}error.textContent=response.status===429?'Too many attempts. Try again later.':response.status===401?'Invalid username or password.':response.status===400||response.status===403?'The browser security check failed. Reload this sign-in page and try again.':'Sign-in is temporarily unavailable. Try again.';error.hidden=false;password.select();}catch(e){error.textContent='Could not reach the server. Try again.';error.hidden=false;}finally{button.disabled=false;}});
</script>
</body></html>
